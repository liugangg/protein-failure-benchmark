ds5_binder_negatives:
  primary_paper:
    name: "Predicting Experimental Success in De Novo Binder Design (Overath et al.)"
    doi: 10.1101/2025.08.14.670059
    date: "2025-08-14"
    license: cc_by_nc_nd        # ⚠️ 这是**预印本正文**的许可, 非商用 + 禁改
    status: OBTAINED            # 2026-09-30 已拿到; 下方 blocked_reason 是历史记录
    historical_blocked_reason: |
      当时 biorxiv.org 正文与补充数据被 Cloudflare 挑战挡住 (实测 source.xml 只回
      "Just a moment..." 页面, 5.6 KB), GitHub 上也没搜到配套仓库。
      后来在 Zenodo 找到配套的数据沉积 (见 dataset_deposit), 问题解决。
  # ⚠️ 许可要分清: 预印本**正文**是 CC BY-NC-ND, 但**数据沉积**是 CC BY 4.0。
  # 我们只用数据沉积里的 final_dataset.csv, 不用正文内容, 所以不受 NC-ND 约束。
  # Zenodo API 实查 (2026-10-02): /api/records/15722219 -> {"id": "cc-by-4.0"}
  dataset_deposit:
    doi: 10.5281/zenodo.15722219
    official_source: https://zenodo.org/records/15722219
    title: >-
      Dataset for: Predicting Experimental Success in De Novo Binder Design:
      A Meta-Analysis of 3,766 Experimentally Characterised Binders
    license: cc-by-4.0
    publication_date: "2025-08-14"
    needed_files:
      - key: final_dataset.csv   # 82 MB; 不下结构包
    citation: >-
      Overath, M. D., Rygaard, A., & Jenkins, T. P. (2025). Dataset for:
      Predicting Experimental Success in De Novo Binder Design: A Meta-Analysis
      of 3,766 Experimentally Characterised Binders [Data set]. Zenodo.
      https://doi.org/10.5281/zenodo.15722219
    ingested: data/interim/ds5_dtu_binder.parquet   # 3,669 条; bind 阴性 3,275
  substitute_actually_obtained:
    - name: Adaptyv Bio EGFR Protein Design Competition Round 1
      repo: https://github.com/adaptyvbio/egfr_competition_1
      year: 2024
    - name: Adaptyv Bio EGFR Protein Design Competition Round 2
      repo: https://github.com/adaptyvbio/egfr_competition_2
      year: 2025
      extra_assets:
        kinetics_raw: https://api.adaptyvbio.com/storage/v1/object/public/egfr_design_competition_2/package.zip
        neutralisation: https://api.adaptyvbio.com/storage/v1/object/public/egfr_design_competition_2/package_neutralisation.zip
        af2_structures: https://api.adaptyvbio.com/storage/v1/object/public/egfr_design_competition_2/structure_predictions.zip
  license_obtained_data: ODbL (data) + Apache-2.0 (code)
  citation_adaptyv: >-
    Adaptyv Bio (2024, 2025). EGFR Protein Design Competition, Rounds 1 and 2.
    https://github.com/adaptyvbio/egfr_competition_1 ;
    https://github.com/adaptyvbio/egfr_competition_2
  license_commercial_note: |
    ODbL 有 share-alike 条款。仓库 LICENSE.md 原话: 需要不带 ODbL 义务的
    商用许可请联系 Adaptyv (igor@adaptyvbio.com)。
  ingested: data/interim/ds5_adaptyv_egfr.parquet   # 604 条; bind 阴性 464, express 阴性 22
  why_valuable: 唯一一批 de novo 设计蛋白的真实湿实验阴性, 直接对冲 SPEC §8 的"时代错配"风险。

ds6_oih_internal:
  status: BLOCKED_ON_USER
  what_was_found_locally:
    - path: <OIH_TASKS_DIR>/tasks.db      # 真实路径见 configs/local_paths.yaml (未入库)
      finding: "0 字节空文件 (ls -la 实测), 没有任何任务历史"
    - path: <OIH_OUTPUTS_DIR>             # 真实路径见 configs/local_paths.yaml (未入库)
      finding: "3053 个子目录, 其中 782 个目录名含 binder/rfdiff/mpnn"
  hard_caveat: |
    这些是**计算**产物 (MPNN 序列、AF3 confidences、ipSAE), 不是湿实验结果。
    按 SPEC §0 原则 2, 计算失败 (ipTM 低、RFdiffusion 没出东西) 不是实验阴性,
    不能当 label 0 用。要么刘刚刚给出真正的湿实验回执路径, 要么 DS6 只能
    当"回顾性验证集"(GATE 4 那一条), 不能进训练标签。
