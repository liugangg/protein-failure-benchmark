# OIH 自有管线的配置 —— **不进论文**。
# 刘刚刚 2026-09-30 明确区分了两件事:
#   论文层面: 基准的职责是给出完整 PR 曲线与若干预算下的 precision@k, 让使用者按自己的
#             成本结构选门槛。原论文也只说最优区间 0.5-0.8, 且跨靶点精度在 0.1-1.0 波动 ——
#             这种不稳定性本身是要报告的发现, 不是要抹平的东西。所以论文里不选单一门槛。
#   管线层面: OIH 的成本结构是明确的, 所以可以也应该选一个。

mdc_binder_gate:
  ipsae_min_threshold: 0.50
  previous_value: 0.15          # MDC_WORKFLOW.md stage 5 原值
  decided_by: 刘刚刚
  decided_on: "2026-09-30"
  cost_rationale: |
    漏掉一个好设计只损失一轮计算 (便宜, 而且可以多跑种子补回来);
    浪费一个湿实验名额则很贵。所以偏精度是对的。
  calibration_evidence: |
    用 DS5 的 3,669 个带真实湿实验结局的设计校准 (reports/ds6_oih_inventory.md §Q2):
      阈值 0.15 (旧): 放过 43.2%, 其中 19.5% 真结合 (基线 10.7%, 增益 1.82x), 漏掉 21.3% 真阳性
      阈值 0.50 (新): 放过 24.4%, 其中 29.0% 真结合 (增益 2.70x),              漏掉 34.0% 真阳性
      阈值 0.60     : 放过 16.0%, 其中 36.3% 真结合 (增益 3.38x),              漏掉 45.9% 真阳性
    选 0.50 而非 0.60: 0.60 的召回损失接近一半, 在靶点难度未知时风险过大;
    0.50 已把命中率从 19.5% 提到 29.0% (接近翻倍), 召回损失还在可接受范围。
  caveat: |
    校准基于 DS5 的 15 个靶点, 与 OIH 的靶点不完全重叠。跨靶点判别力差异极大
    (DS5 上逐靶点最高 F1 从 0.222 到 1.000), 所以这是**总体期望**,
    不保证在某个特定新靶点上成立。新靶点第一轮建议同时看 0.50 和 0.60 两档的候选数。
  where_to_apply: OIH 内部管线的 MDC 工作流 stage 5 的 ipSAE 过滤 (内部路径不入库)
  note: 本文件只是决策记录; 实际改动 MDC_WORKFLOW.md 属于 OIH 平台线, 不在本项目范围内。
