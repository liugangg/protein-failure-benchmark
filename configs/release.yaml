# 发布标识的**单一出处**。生成器从这里取, 稿件里不手写。
#
# 为什么: Zenodo 的 reserved DOI 在沉积发布前不解析 (实测 doi.org / zenodo API /
# DataCite 三处均 404)。所以 DOI 必须能"一处改、处处生效", 且在未落实时
# 稿件里出现**明显的占位符**而不是一个看起来像真的死 DOI。

repo_url: https://github.com/liugangg/protein-failure-benchmark

# 沉积发布后填实际 DOI (形如 10.5281/zenodo.XXXXXXXX)。
# 填上之后 src/eval/build_submission.py 会强制要求稿件第 1 页的内部 TODO 已删除 ——
# 预印本不该带着 TODO 上线。
zenodo_doi: null

# 沉积尚未发布时置 true: 稿件改为明说"DOI 将在修订版补上", 而不是带着
# 占位符或内部待办上线。预印本先挂、数据 DOI 作为 v2 补上是常规做法。
# DOI 落实后把 zenodo_doi 填上并把本项改回 false, build_submission.py 会强制稿件同步。
zenodo_deposit_pending: true
