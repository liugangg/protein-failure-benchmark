# 三套留出测试集的定义 (SPEC §3.1)。一旦冻结就不许因为分数不好回来改。
# SPEC 原文: "测试集一旦确定就冻结, 写入 data/processed/splits/ 并记录 hash。
#            之后任何阶段都不允许因为分数不好而重新切分。"
version: 1
seed: 20260930

sequence_split:
  # 按 split_group (30% 相似度的传递闭包分量) 整组划分, 一个组只能出现在一侧。
  fractions: {train: 0.8, val: 0.1, test: 0.1}
  unit: split_group
  sources: all
  # 超大组强制进训练侧。
  pin_large_groups_to_train_above_fraction: 0.01
  pin_rationale: |
    实测在 30% 相似度 / 80% 覆盖(较短序列)下做传递闭包, TargetTrack 的靶点空间
    形成一个巨型连通分量: 单个 split_group 含 26,373 个 set-cover 簇 / 158,681 条
    序列 = 全部序列的 44.7%; 第二大的再占 41,744 条。两个组合计占 56% 的序列。
    成因不是短片段搭桥 (已验证: 巨型组长度中位 293aa, <60aa 的只占 0.6%, 比其余还少),
    而是**多结构域蛋白在家族之间搭桥** —— A 与 B 共享域 1, A 与 C 共享域 2,
    传递闭包就把 B 和 C 也连到一起。这是结构基因组学靶点空间的真实性质。
    这么大的组无论落到哪一侧都会把那一侧撑成全库的一半, 当测试集更是荒谬。
    所以: 占比超过 1% 的组一律进训练侧, 测试/验证集只从其余小组里出。
    代价要说清楚: 测试集**系统性地不含**那些处在大同源网络里的蛋白,
    它代表的是"同源网络外围/孤立的蛋白"。报告结论时必须带上这个限定。

lab_split:
  # 只在 DS1 (TargetTrack) 上做 —— 它是唯一的多实验室源。
  # DS2/DS3/DS5 各自只有一个实验室(课题组), 放进来就是单点, 没有"跨实验室泛化"的含义。
  sources: [ds1_targettrack]
  holdout_centers: [CSGID, EFI]
  holdout_rationale: |
    挑选规则: (a) 该 center 必须有足够阴性, 否则测试集里没有阴性可算 precision@k;
             (b) 不能是阴性的最大贡献方, 否则训练侧的阴性被抽干。
    实测各 center 的 express 阴性簇数: NYSGRC 6,543 (53.7%) / CSGID 3,353 /
    NYSGXRC 2,142 / EFI 1,071 / CESG 383。留 CSGID + EFI 到测试侧 ->
    测试侧约 4,424 个 express 阴性簇, 训练侧仍留约 9,068 个。
    NYSGRC 留在训练侧, 因为它一家占 53.7%, 留出它等于废掉训练集。
  conflict_policy: drop_mixed_clusters
  conflict_rationale: |
    92,779 个簇里有 25,818 个 (27.8%) 跨多个 center。实验室切分和簇完整性天然冲突。
    三种处理里选了最干净的一种:
      (1) 混合簇整簇归测试 -> 测试集里混进非留出实验室的记录, "跨实验室"的解释就脏了
      (2) 混合簇整簇归训练 -> 测试集与训练集存在同源序列, 直接泄漏
      (3) **混合簇两边都不要** <- 采用。测试侧记录全部来自留出实验室,
          且训练侧不含任何与测试侧同源(>30%)的序列。代价是丢掉一部分数据, 已记数。

time_split:
  # 同样只在 DS1 上做: SPEC §8 的"时代漂移"指的是 TargetTrack 2000-2017 内部的年代差。
  # DS2 全部记为 2023、DS5 是 2024/2025, 把它们算进"2015 年以后"会让这个集子失去含义。
  sources: [ds1_targettrack]
  test_from_year: 2015
  conflict_policy: drop_mixed_clusters
  conflict_rationale: |
    同一个簇里既有 2015 前又有 2015 后的记录时两边都不要, 理由同上。

bind_target_split:
  # 第四套留出集, 专给 bind 头 —— SPEC 的三套里 bind 没有可评测的泛化切分:
  # 实验室留出集 (留出 TargetTrack 的 CSGID+EFI) 侧的 bind 阴性是 0, 因为 bind 数据
  # 全部来自 TargetTrack 以外的研究, 与那套切分不相交。
  #
  # 检验的问题是真实使用场景: **面对训练中没见过的靶点, 能不能预测 binder 会不会结合。**
  sources: [ds5_dtu_binder, ds5_adaptyv_egfr]
  scope_rationale: |
    只用 DS5 (真实 de novo binder 设计的湿实验结合结果)。
    不含 DS3 的 bind: 它测的是"突变让已有结合变弱多少", 与"从头设计的 binder 会不会结合"
    不是同一个问题 (见 configs/data_sources.yaml 的 semantic_mismatch), 混进来会让任务定义漂移。
    也不含 DS1 的 186 条 bind (来自 v2 §2.4 推断, 证据等级最弱且与设计蛋白无关)。
  holdout_targets: [IL7Ra, TrkA, Mdm2]
  holdout_rationale: |
    挑选规则 (实测 15 个靶点 / 1,325 个 split_group 之后定的):
      (a) 最大的两个靶点必须留在训练侧: FGFR2 占 38.0% 的 group、EGFR 占 20.0%,
          合计 58%, 留出任一个都会把训练侧抽干。
      (b) 留出集合占全部 group 的 20-30%: IL7Ra 143 + TrkA 98 + Mdm2 39 = 280 (21.1%)。
      (c) **必须含至少一个失败率明显低于其它靶点的**, 否则测试集几乎全是阴性,
          precision@k 会因基础失败率接近 1 而失去区分力。
          各靶点结合失败率多在 85-98%, 只有 Mdm2 是 42.7% —— 所以 Mdm2 必须进留出集。
      三个靶点分别来自 2 / 2 / 1 个研究, 不是同一批次。
  conflict_policy: drop_mixed_clusters
  conflict_note: |
    实测 1,325 个 split_group 里只有 42 个跨靶点 (3.2%), 所以丢弃混合组的代价很小 ——
    远好于 TargetTrack 上的实验室切分 (那里 27.8% 的簇跨中心)。
    原因是不同靶点的 binder 设计骨架大多不同源。
