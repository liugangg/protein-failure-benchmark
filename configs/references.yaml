  crystal_review:
    key: "Wang2018"
    authors: "Wang H, Feng L, Webb GI, Kurgan L, Song J, Lin D"
    year: 2018
    title: >-
      Critical evaluation of bioinformatics tools for the prediction of protein
      crystallization propensity
    journal: "Briefings in Bioinformatics"
    volume: "19"
    issue: "5"
    pages: "838-852"
    doi: "10.1093/bib/bbx018"
    verbatim:
      data_sources: >-
        The data sets used to develop these tools were derived from a number of relevant
        public databases, including TargetDB, PepcDB and TargetTrack.
      multistage: >-
        Three tools (PPCPred, PredPPCrys and Crysalis) also predict the propensity for
        successfully completing some of the crucial steps during the crystallization
        process.
      pipeline_bias: >-
        a portion of crystal structures deposited in PDB was determined traditionally by
        structural biologists using specialized equipment, unique protocols and laborious
        trial-and-error efforts.
    does_center_level_analysis: false
    center_check_note: >-
      **家族级结论的依据**。该综述系统评测了这一整支预测器, 全文实查:
      无任何按实验室 / 结构基因组学中心的分层或评测切分; 它明确写出 TargetTrack 的数据来自
      ">40 structural genomics centers worldwide", 却未就此做任何中心级分析。
      去冗余一律只用序列同源阈值 (类内 / 类间 25% identity)。
      综述确实提到了"流水线偏差"(见 pipeline_bias 引语), 但未系统考察中心级混杂 ——
      这正是本文补上的那一步。
